name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2

      - uses: astral-sh/setup-uv@v6

      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@v2
        with:
          tool: ripgrep

      - name: Install managed tui-driver
        run: cargo install --git https://github.com/amenocturne/tui-driver.git --rev 0919a8efb130f5e5784dab227a84550284e08ad4 --locked tui-driver

      - name: Prepare distribution Lua dependencies
        run: |
          brew install lua@5.4 luarocks openssl@3
          tools/prepare-lua-dependencies.sh lua/nefor-pm/nefor-pm-dev-1.rockspec lua/nefor-pm/dependencies.lock target/lua-dependencies
          echo "NEFOR_LUA_DEPENDENCIES_ROOT=$PWD/target/lua-dependencies" >> "$GITHUB_ENV"

      - name: Check verification-lane completeness
        run: |
          just check-test-lanes
          just test-test-lanes-checker

      - name: Run default deterministic lane
        run: just test-default

      - name: Run full deterministic lane
        run: just test-full

      - name: Exercise prepared native Lua HTTP stack
        run: |
          cargo build -p nefor --locked
          just test-pm-http "$PWD/target/debug/nefor" "$NEFOR_LUA_DEPENDENCIES_ROOT" "$PWD/tmp/pm-http"

      - name: Upload TUI scenario artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tui-scenario-artifacts
          path: tmp/tui-driver-artifacts/
          if-no-files-found: ignore

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  source-install-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: astral-sh/setup-uv@v6
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@just
      - name: Install declared native prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential m4 pkg-config lua5.4 liblua5.4-dev luarocks libssl-dev curl ca-certificates unzip jq
      - name: Fresh exact-revision source-install acceptance
        run: RUSTUP_HOME="$HOME/.rustup" just accept-source-install "$GITHUB_SHA" "$PWD/tmp/source-install-acceptance"
