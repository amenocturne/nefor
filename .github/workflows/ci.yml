name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --workspace --locked

      - name: release bundle completeness
        run: tools/test-release-bundle.sh "$PWD/target/debug"

      - name: cargo test
        run: |
          cargo test --workspace --exclude nefor-tui --locked
          cargo test -p nefor-tui --lib --locked
          cargo test -p nefor-tui --test chat_test --locked -- --test-threads=1

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  tui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tui-smoke

      - uses: taiki-e/install-action@just

      - name: Install managed tui-driver
        run: cargo install --git https://github.com/amenocturne/tui-driver.git --rev 0919a8efb130f5e5784dab227a84550284e08ad4 --locked tui-driver

      - name: Run TUI daily-path scenarios
        run: just test-tui-scenarios

      - name: Upload TUI smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tui-scenario-artifacts
          path: tmp/tui-driver-artifacts/
          if-no-files-found: ignore
