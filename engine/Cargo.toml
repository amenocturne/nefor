[package]
name = "nefor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "nefor engine — NCP broker and Lua plugin host."
default-run = "nefor"

[dependencies]
nefor-protocol = { path = "../crates/nefor-protocol" }
tokio = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
mlua = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
libc = "0.2"
tiny_http = "0.12"

[features]
full-tests = []

[[test]]
name = "agentic_cli_mock_e2e"
path = "tests/agentic_cli_mock_e2e.rs"
required-features = ["full-tests"]

[[test]]
name = "routed_web_e2e"
path = "tests/routed_web_e2e.rs"
required-features = ["full-tests"]

[[test]]
name = "nefor_pm_test"
path = "tests/nefor_pm_test.rs"
required-features = ["full-tests"]

[[test]]
name = "starter_lead_workflow_test"
path = "tests/starter_lead_workflow_test.rs"
required-features = ["full-tests"]

[[test]]
name = "starter_sessions_test"
path = "tests/starter_sessions_test.rs"
required-features = ["full-tests"]

[[test]]
name = "producer_admission_process_test"
path = "tests/producer_admission_process_test.rs"
required-features = ["full-tests"]

[dev-dependencies]
nefor-mag = { path = "../crates/nefor-mag" }
nefor-tui = { path = "../plugins/nefor-tui" }
tempfile = "3"

[[test]]
name = "compaction_process"
path = "tests/compaction_process.rs"
required-features = ["full-tests"]
