[package]
name = "openai-provider"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "NCP v0.1 plugin that talks to any OpenAI-compatible chat-completions endpoint (Ollama, Groq, OpenRouter, OpenAI, vLLM, …), streaming text deltas back as chat-contract events. Spawn N times with different env per instance to wire up multiple providers from one binary."

[lib]
name = "openai_provider"
path = "src/lib.rs"

[[bin]]
name = "openai-provider"
path = "src/main.rs"
test = false

[features]
full-tests = []

[[test]]
name = "openai_provider_default"
path = "tests/openai_provider_default.rs"

[[test]]
name = "openai_provider_full"
path = "tests/openai_provider_full.rs"
required-features = ["full-tests"]

[[test]]
name = "completion_dispatch"
path = "tests/completion_dispatch.rs"
required-features = ["full-tests"]

[[test]]
name = "stream_integration"
path = "tests/stream_integration.rs"
required-features = ["full-tests"]

[[test]]
name = "wire_logging"
path = "tests/wire_logging.rs"
required-features = ["full-tests"]

[dependencies]
nefor-protocol = { path = "../../crates/nefor-protocol" }
nefor-plugin-sdk = { path = "../../crates/nefor-plugin-sdk" }
nefor-sse = { path = "../../crates/nefor-sse" }
nefor-provider-http = { path = "../../crates/nefor-provider-http" }
tokio = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
httpdate = "1"
tokio-util = { workspace = true }
uuid = { version = "1", features = ["v4"] }
clap = { workspace = true, features = ["env"] }

[dev-dependencies]
mlua = { workspace = true }
nefor-mag = { path = "../../crates/nefor-mag" }
tokio = { workspace = true, features = ["test-util"] }
serde_json = { workspace = true }
tokio-util = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
