[package]
name = "basic-tools-plugin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "NCP v0.1 plugin: file, image, and process capabilities behind Lua-defined tools."

[[bin]]
name = "basic-tools"
path = "src/main.rs"
test = false

[dependencies]
nefor-protocol = { path = "../../crates/nefor-protocol" }
nefor-plugin-sdk = { path = "../../crates/nefor-plugin-sdk" }
tokio = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"

[features]
full-tests = []

[[test]]
name = "basic_tools_default"
path = "tests/basic_tools_default.rs"

[[test]]
name = "basic_tools_full"
path = "tests/basic_tools_full.rs"
required-features = ["full-tests"]
