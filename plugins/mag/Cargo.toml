[package]
name = "mag-plugin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "NCP v0.1 plugin: MAG actor-kernel runtime for immutable versioned program and delta envelopes."

# Binary is `mag-plugin`, not `mag`: the `nefor-mag` crate already owns a
# `mag` binary (the compiler CLI), so the plugin gets a distinct name to
# avoid a workspace output-filename collision. Bus identity stays `mag`
# (assigned in examples/nefor-agent/init.lua).
[[bin]]
name = "mag-plugin"
path = "src/main.rs"
test = false

[dependencies]
nefor-protocol = { path = "../../crates/nefor-protocol" }
nefor-plugin-sdk = { path = "../../crates/nefor-plugin-sdk" }
nefor-mag = { path = "../../crates/nefor-mag" }
tokio = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["unbounded_depth"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
mlua = { workspace = true }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
git-worktree-plugin = { path = "../git-worktree" }
tempfile = "3"
nefor-cargo-test-harness = { path = "../../tools/cargo-test-harness" }

[features]
full-tests = []

[[test]]
name = "mag_plugin_default"
path = "tests/mag_plugin_default.rs"

[[test]]
name = "mag_plugin_full"
path = "tests/mag_plugin_full.rs"
required-features = ["full-tests"]

[[test]]
name = "acceptance"
path = "tests/acceptance.rs"
required-features = ["full-tests"]

[[test]]
name = "chatgpt_tools_e2e"
path = "tests/chatgpt_tools_e2e.rs"
required-features = ["full-tests"]

[[test]]
name = "lead_turn"
path = "tests/lead_turn.rs"
required-features = ["full-tests"]

[[test]]
name = "mag_corpus"
path = "tests/mag_corpus.rs"
required-features = ["full-tests"]

[[test]]
name = "structured_provider_e2e"
path = "tests/structured_provider_e2e.rs"
required-features = ["full-tests"]

[[test]]
name = "compaction_bridge"
path = "tests/compaction_bridge.rs"
